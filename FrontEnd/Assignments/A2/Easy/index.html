<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="nav">
        <img src="./Screenshot 2026-09-09 114239.png" alt="Logo">
        <div class="link">
            <h3 class="links">Home</h3>
            <h3 class="links">About Us</h3>
            <h3 class="links">Blogs</h3>
            <h3 class="links">Contact Us</h3>
        </div>
        <button class="start">Get Started</button>
    </div>

    <div class="hero">
        <h1>Insights & Blogs</h1>
    </div>

    <div class="section">
        <button class="secButton">All</button>
        <button class="secButton">Tech</button>
        <button class="secButton">SaaS</button>
        <button class="secButton">Marketing</button>
    </div>

    <div class="topic">
        <div class="article">
            <img src="./Tech.jpg" alt="Tech">
            <div class="article-content">
                <span class="category">Tech</span>
                <h2>The Ultimate Guide To SaaS Marketing</h2>

                <p>May 23, 2025</p>
            </div>
        </div>

        <div class="article">
            <img src="./SaaS.jpg" alt="SaaS">
            <div class="article-content">
                <span class="category">SaaS</span>
                <h2>5 Trends In SaaS Growth For 2025</h2>

                <p>May 23, 2025</p>
            </div>
        </div>

        <div class="article">
            <img src="./Marketing.jpg" alt="Marketing">
            <div class="article-content">
                <span class="category">Marketing</span>
                <h2>How Data-Driven Stratiges Are Important</h2>

                <p>May 23, 2025</p>
            </div>
        </div>
    </div>
</body>
</html>
