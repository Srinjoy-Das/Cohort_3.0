<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="innerBox">
      <button class="menuButton">
        <img src="./logos/menu.png" alt="menu" />
      </button>
      <button class="mode">
        <img src="./logos/light.png" alt="mode" />
      </button>
      <div id="search">
        <h3>Search for a pokemon...</h3>
      </div>

      <div class="dropDownMenu">
        <select name="Filter" id="filterTypes">
          <option value="all">Filter by types (1)</option>
          <option value="normal">Normal</option>
          <option value="fire">Fire</option>
          <option value="water">Water</option>
          <option value="electric">Electric</option>
          <option value="grass">Grass</option>
          <option value="ice">Ice</option>
          <option value="fighting">Fighting</option>
          <option value="poison">Poison</option>
          <option value="ground">Ground</option>
          <option value="flying">Flying</option>
          <option value="psychic">Psychic</option>
          <option value="bug">Bug</option>
          <option value="rock">Rock</option>
          <option value="ghost">Ghost</option>
          <option value="dragon">Dragon</option>
          <option value="dark">Dark</option>
          <option value="steel">Steel</option>
          <option value="fairy">Fairy</option>
        </select>
      </div>

      <button class="sort">
        <img src="./logos/sort.png" alt="sort" />
      </button>

      <div class="pokemonContainer">

        <div class="pokemon" id="meowscarada">
          <button class="like">
            <img class="Heart" src="./logos/like.png" alt="like">
          </button>

          <img class="element" src="./logos/grass.png" alt="grass">
          <div class="pokemonImage">
            <img src="./pokemonPic/meowscarada.jpg" alt="meowscarada" />
          </div>

          <div class="pokemonInfo">
            <h2>Meowscarada</h2>
            <p>Grass</p>
          </div>
          
          <button class="enter">
            <img class="enterArrow" src="./logos/enter.png" alt="enter">
          </button>

        </div>

        <div class="pokemon" id="pawniard">
          <button class="like">
            <img class="Heart" src="./logos/like.png" alt="like">
          </button>

          <img class="element" src="./logos/steel.png" alt="steel">
          <div class="pokemonImage">
            <img src="./pokemonPic/pawniard.png" alt="pawniard" />
          </div>

          <div class="pokemonInfo">
            <h2>Pawniard</h2>
            <p>Dark / Steel</p>
          </div>
          
          <button class="enter">
            <img class="enterArrow" src="./logos/enter.png" alt="enter">
          </button>

        </div>

        <div class="pokemon" id="houndoom">
          <button class="like">
            <img class="Heart" src="./logos/like.png" alt="like">
          </button>

          <img class="element" src="./logos/fire.png" alt="fire">
          <div class="pokemonImage">
            <img src="./pokemonPic/houndoom.jpeg" alt="houndoom" />
          </div>

          <div class="pokemonInfo">
            <h2>Houndoom</h2>
            <p>Dark / Fire</p>
          </div>
          
          <button class="enter">
            <img class="enterArrow" src="./logos/enter.png" alt="enter">
          </button>

        </div>

        <div class="pokemon" id="inkay">
          <button class="like">
            <img class="Heart" src="./logos/like.png" alt="like">
          </button>

          <img class="element" src="./logos/water.png" alt="water">
          <div class="pokemonImage">
            <img src="./pokemonPic/inkay.png" alt="inkay" />
          </div>

          <div class="pokemonInfo">
            <h2>Inkay</h2>
            <p>Dark / Psychic</p>
          </div>
          
          <button class="enter">
            <img class="enterArrow" src="./logos/enter.png" alt="enter">
          </button>

        </div>
      </div>

      <div id="Disclaimer">
        <img src="./logos/game.png" alt="game">
        <h5>2024 Pokemon. All rights reserved.</h5>
      </div>

    </div>
    <img id="logo" src="./logo.png" alt="logo" />
  </body>
</html>
